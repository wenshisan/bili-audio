name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "bili_audio/assets/app_icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build installers"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html site/get.html site/download.svg _site/
          cp -r site/demo _site/demo
          cp bili_audio/assets/app_icon.png _site/icon.png
          ipa_url="https://github.com/wenshisan/bili-audio/releases/download/continuous/bili_audio-ios.ipa"
          version=$(awk '/^version:/ {print $2; exit}' bili_audio/pubspec.yaml)
          version=${version%%+*}
          for api in \
            "https://api.github.com/repos/wenshisan/bili-audio/releases/latest" \
            "https://api.github.com/repos/wenshisan/bili-audio/releases/tags/continuous"
          do
            code=$(curl -sS -o /tmp/rel.json -w "%{http_code}" -H "Accept: application/vnd.github+json" "$api" || true)
            if [ "$code" != "200" ]; then
              continue
            fi
            found=$(python3 -c 'import json; d=json.load(open("/tmp/rel.json")); print(next((a["browser_download_url"] for a in d.get("assets", []) if a.get("name")=="bili_audio-ios.ipa"), ""))')
            if [ -n "$found" ]; then
              ipa_url="$found"
              tag=$(python3 -c 'import json; print(json.load(open("/tmp/rel.json")).get("tag_name",""))')
              tag=${tag#v}
              # 清单要和 IPA 的短版本一致。构建号在 CFBundleVersion 里，不写进这里。
              tag=${tag%%+*}
              case "$tag" in
                [0-9]*) version="$tag" ;;
              esac
              break
            fi
          done
          cat > _site/manifest.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${ipa_url}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.bilimusic.biliAudio</string>
                  <key>bundle-version</key>
                  <string>${version}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>bili-audio</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          sed -i 's/^          //' _site/manifest.plist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
