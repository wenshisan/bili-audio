name: Build installers

on:
  push:
    branches: [main]
    paths:
      - "bili_audio/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: installers
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      release_tag: ${{ steps.compute.outputs.release_tag }}
      release_name: ${{ steps.compute.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | .tag_name, .name' > /tmp/releases.txt
          python3 bili_audio/packaging/ci_version.py \
            --pubspec bili_audio/pubspec.yaml \
            --releases /tmp/releases.txt \
            --ref-type "$REF_TYPE" \
            --ref-name "$REF_NAME" \
            | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            target: android
          - name: Windows
            os: windows-latest
            target: windows
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS
            os: macos-latest
            target: macos
          - name: iOS
            os: macos-latest
            target: ios
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" bili_audio/packaging/ci_version.py --stamp --pubspec bili_audio/pubspec.yaml --version "$VERSION"

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'windows'

      - name: Allow Windows symlinks
        if: matrix.target == 'windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Install Linux build packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++ libsecret-1-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is unset; the APK will be debug-signed."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > bili_audio/android/app/ci-release.keystore
          cat > bili_audio/android/key.properties << EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=ci-release.keystore
          EOF

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: bili_audio
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bili_audio-android.apk

      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Set-Location bili_audio
          flutter pub get
          flutter build windows --release
          Set-Location ..
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force -Path bili_audio\dist | Out-Null
          $match = Select-String -Path bili_audio\pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value.Replace('+', '.')
          $issPath = (Resolve-Path bili_audio\packaging\windows\bili_audio.iss).Path
          $text = [System.IO.File]::ReadAllText($issPath)
          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText($issPath, $text, $utf8Bom)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $issPath

      - name: Build Linux package
        if: matrix.target == 'linux'
        working-directory: bili_audio
        run: |
          flutter pub get
          flutter build linux --release
          sed -i 's/\r$//' packaging/linux/build-deb.sh
          bash packaging/linux/build-deb.sh

      - name: Build macOS disk image
        if: matrix.target == 'macos'
        working-directory: bili_audio
        run: |
          # macos-latest 是 7GB 的 Apple 芯片机器。通用包要同时编 x86_64，
          # 内存不够时 xcodebuild 会被杀掉。发布的 dmg 也只要 arm64。
          flutter config --enable-macos-arm64-only
          flutter pub get
          # 插件的 Package.swift / podspec 仍写着 macOS 10.14。Xcode 26 的最低部署版本是 11。
          python3 - << 'PY'
          import os, pathlib, re
          cache = pathlib.Path(os.environ.get("PUB_CACHE", pathlib.Path.home() / ".pub-cache"))
          hosted = cache / "hosted"
          if not hosted.is_dir():
              raise SystemExit(f"pub cache not found: {hosted}")
          swift = re.compile(r'\.macOS\("(10\.\d+|11\.0)"\)')
          pod = re.compile(r"""(\.osx\.deployment_target\s*=\s*['"])(?:10\.\d+|11\.0)(['"])""")
          changed = 0
          for path in hosted.rglob("*"):
              if path.name == "Package.swift":
                  text = path.read_text(encoding="utf-8")
                  new, count = swift.subn('.macOS("12.0")', text)
              elif path.suffix == ".podspec":
                  text = path.read_text(encoding="utf-8")
                  new, count = pod.subn(r"\g<1>12.0\2", text)
              else:
                  continue
              if count:
                  path.write_text(new, encoding="utf-8")
                  changed += count
          print(f"raised {changed} macOS deployment targets to 12.0")
          PY
          flutter build macos --release
          mkdir -p dist
          hdiutil create \
            -volname "bili-audio" \
            -srcfolder "build/macos/Build/Products/Release/bili_audio.app" \
            -ov -format UDZO \
            "dist/bili_audio-macos-arm64.dmg"

      - name: Build iOS package
        if: matrix.target == 'ios'
        working-directory: bili_audio
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          sed -i '' $'s/\r$//' packaging/ios/build-ipa.sh
          bash packaging/ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        if: matrix.target != 'ios' || hashFiles('bili_audio/dist/bili_audio-ios.ipa') != ''
        with:
          name: installer-${{ matrix.target }}
          path: bili_audio/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    if: always() && !cancelled() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Create or replace GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.version.outputs.release_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers were produced."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
            > /tmp/tags.txt
          prev="$(python3 bili_audio/packaging/ci_version.py \
            --previous-tag \
            --releases /tmp/tags.txt \
            --current "$RELEASE_NAME")"
          if [ -n "$prev" ]; then
            git log "${prev}..HEAD" --no-merges --pretty=format:%s > /tmp/subjects.txt
          else
            : > /tmp/subjects.txt
          fi
          python3 bili_audio/packaging/ci_version.py \
            --notes-file /tmp/notes.md \
            --subjects /tmp/subjects.txt \
            --sha "$GITHUB_SHA" \
            --version "$RELEASE_NAME" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_TAG" == *"+"* ]]; then
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            else
              gh release delete "$RELEASE_TAG" --yes
            fi
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --title "$RELEASE_NAME" \
            --notes-file /tmp/notes.md \
            --latest
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous "${files[@]}" \
            --title "$RELEASE_NAME" \
            --notes-file /tmp/notes.md \
            --prerelease
