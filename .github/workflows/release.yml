name: Build installers

on:
  push:
    branches: [main]
    paths:
      - "bili_audio/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            target: android
          - name: Windows
            os: windows-latest
            target: windows
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS
            os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'windows'

      - name: Allow Windows symlinks
        if: matrix.target == 'windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Install Linux build packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is unset; the APK will be debug-signed."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > bili_audio/android/app/ci-release.keystore
          cat > bili_audio/android/key.properties << EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=ci-release.keystore
          EOF

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: bili_audio
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bili_audio-android.apk

      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Set-Location bili_audio
          flutter pub get
          flutter build windows --release
          Set-Location ..
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force -Path bili_audio\dist | Out-Null
          $match = Select-String -Path bili_audio\pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value.Split('+')[0]
          $issPath = (Resolve-Path bili_audio\packaging\windows\bili_audio.iss).Path
          $text = [System.IO.File]::ReadAllText($issPath)
          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText($issPath, $text, $utf8Bom)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" $issPath

      - name: Build Linux package
        if: matrix.target == 'linux'
        working-directory: bili_audio
        run: |
          flutter pub get
          flutter build linux --release
          sed -i 's/\r$//' packaging/linux/build-deb.sh
          bash packaging/linux/build-deb.sh

      - name: Build macOS disk image
        if: matrix.target == 'macos'
        working-directory: bili_audio
        run: |
          flutter pub get
          flutter build macos --release
          mkdir -p dist
          hdiutil create \
            -volname "Bili Audio" \
            -srcfolder "build/macos/Build/Products/Release/bili_audio.app" \
            -ov -format UDZO \
            "dist/bili_audio-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: bili_audio/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Create or replace GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers were produced."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            title="$tag"
            extra=(--latest)
          else
            tag="continuous"
            title="Continuous"
            extra=(--prerelease)
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
          notes="$(cat <<EOF
          由 GitHub Actions 从 \`${GITHUB_SHA}\` 自动构建。

          | 平台 | 文件 |
          | --- | --- |
          | Android | \`bili_audio-android.apk\` |
          | Windows | \`bili_audio-windows-x64-setup.exe\` |
          | Linux | \`bili_audio-linux-amd64.deb\` |
          | macOS (Apple 芯片) | \`bili_audio-macos-arm64.dmg\` |

          应用内升级只认 \`v*\` 正式版。\`continuous\` 是每次推送到 main 的预发布，介绍页在没有正式版时用它提供下载。

          构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          gh release create "$tag" "${files[@]}" \
            --title "$title" \
            --notes "$notes" \
            "${extra[@]}"
