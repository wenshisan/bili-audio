name: bili_audio
description: "哔哩哔哩第三方音频播放器 (个人学习用途, 与哔哩哔哩官方无关)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

# 依赖使用精确版本 (dev-tasks D11), 升级时显式修改并提交 pubspec.lock
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 桌面端无边框窗口 + 托盘 (沿用 talix_companion_flutter 方案)
  window_manager: 0.5.2
  tray_manager: 0.5.3

  # 状态管理 / 代码生成注解
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # 网络 / 存储
  dio: 5.11.1
  drift: 2.35.2
  sqlite3_flutter_libs: 0.6.0+eol
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  connectivity_plus: 7.3.2

  # 播放
  just_audio: 0.10.6
  audio_service: 0.18.19

  # 路由 / 工具
  go_router: 18.1.0
  lpinyin: 2.0.3
  crypto: 3.0.7
  path: 1.9.1
  just_audio_media_kit: 2.1.0
  media_kit_libs_windows_audio: 1.0.9
  media_kit_libs_linux: 1.2.1
  smtc_windows: 1.1.0
  intl: 0.20.2
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  riverpod_generator: 4.0.9
  freezed: 4.0.0-dev.3
  json_serializable: 6.15.1
  drift_dev: 2.35.1
  http_mock_adapter: 0.6.1
  matcher: 0.12.19

# smtc_windows 1.1.0 的 Dart/Rust 绑定由 flutter_rust_bridge 2.11.1 生成,
# 其依赖声明为 ^2.11.1, 会被解析到 2.13.x 导致 RustLib.init 版本校验失败。
dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_icon.ico
    - assets/app_icon.png
    - assets/config/
