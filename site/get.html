<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>下载 bili-audio</title>
  <link rel="icon" href="icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #14120f;
      --card: #211d18;
      --line: #3a332b;
      --text: #f4efe6;
      --muted: #b7ab9b;
      --accent: #e3a15a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
    .mark, .note { color: var(--muted); }
    a.go {
      display: block;
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #14120f;
      font-weight: 650;
      text-align: center;
      text-decoration: none;
    }
    a.go.disabled { opacity: 0.55; pointer-events: none; }
    a.back { color: var(--accent); }
    .note { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <p class="mark">bili-audio</p>
    <h1>下载到这台手机</h1>
    <p id="lead">正在准备安装包…</p>
    <a class="go" id="action" hidden href="./">下载</a>
    <p class="note" id="detail"></p>
    <p class="note"><a class="back" href="./">返回介绍页</a></p>
  </main>
  <script>
    const repo = "wenshisan/bili-audio";
    const files = { android: "bili_audio-android.apk" };
    const fallbackApk = "https://github.com/wenshisan/bili-audio/releases/download/continuous/bili_audio-android.apk";
    const iosHref = "itms-services://?action=download-manifest&url=https%3A%2F%2Fwenshisan.github.io%2Fbili-audio%2Fmanifest.plist";
    const lead = document.getElementById("lead");
    const action = document.getElementById("action");
    const detail = document.getElementById("detail");
    const ua = navigator.userAgent;
    const wechat = /MicroMessenger|QQ\//i.test(ua);
    const android = /Android/i.test(ua);
    const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const safari = iOS && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) && !wechat;

    function showAction(text, href, enabled) {
      action.hidden = false;
      action.textContent = text;
      action.href = href;
      action.classList.toggle("disabled", !enabled);
    }

    async function resolve() {
      const urls = [
        "https://api.github.com/repos/" + repo + "/releases/latest",
        "https://api.github.com/repos/" + repo + "/releases/tags/continuous",
      ];
      let apk = fallbackApk;
      let iosReady = false;
      let label = "";
      let apkFound = false;
      for (const url of urls) {
        let data;
        try {
          const response = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
          if (!response.ok) continue;
          data = await response.json();
        } catch (_) {
          continue;
        }
        const assets = new Map((data.assets || []).map((asset) => [asset.name, asset]));
        if (assets.has("bili_audio-ios.ipa")) iosReady = true;
        if (apkFound) continue;
        const asset = assets.get(files.android);
        if (!asset) continue;
        apk = asset.browser_download_url;
        apkFound = true;
        label = (data.prerelease ? "预发布 " : "正式版 ") + data.tag_name;
      }
      return { apk, iosReady, label, apkFound };
    }

    async function start() {
      const pack = await resolve();
      if (android) {
        lead.textContent = pack.apkFound
          ? "Android 安装包已准备好" + (pack.label ? "（" + pack.label + "）。" : "。")
          : "还没有可下载的安装包。推送到 main 后，Actions 会生成 APK。";
        detail.textContent = wechat
          ? "微信里通常下不了安装包。请点右上角，用系统浏览器打开本页。"
          : "下载后需要允许本应用安装未知应用。";
        showAction("下载 APK", pack.apk, pack.apkFound);
        return;
      }
      if (iOS) {
        if (!safari) {
          lead.textContent = "请用 iPhone 自带的 Safari 打开本页，再安装。";
          detail.textContent = "从微信或其他应用扫码时，点右上角，选择在 Safari 中打开。";
          return;
        }
        lead.textContent = pack.iosReady
          ? "在 Safari 里安装到这台 iPhone。"
          : "iOS 安装包还没有生成。需要先在 Actions 里配好 Apple 签名。";
        detail.textContent = "装完后到「设置 → 通用 → VPN 与设备管理」里信任该描述文件。";
        showAction("安装", iosHref, pack.iosReady);
        return;
      }
      lead.textContent = "用手机相机扫描介绍页上的二维码，即可打开本页。";
      detail.textContent = "电脑上的安装包仍在介绍页的下载区。";
      showAction("打开介绍页", "./", true);
    }

    start();
  </script>
</body>
</html>
